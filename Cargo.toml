[workspace]
resolver = "3"
# The HTTP client is the repository's only package. The root stays virtual so
# examples, tests, and documentation all exercise the same library artifact.
members = ["crates/*"]
# Worktrees contain another copy of this manifest and must not become members.
exclude = ["worktrees"]

# Shared package metadata. A member inherits a field with `field.workspace =
# true`, so the version the release workflow bumps is written in exactly one
# place and every crate moves together.
[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinyjevclient"

[workspace.dependencies]
# Derive macros for the crate-wide error type.
# Every dependency entry should carry a comment like this one saying why it is
# here.
thiserror = "2"
# Requests and responses use the TypeSafe System One JSON wire contract.
serde = { version = "1", features = ["derive"] }
# State and structured instructions may contain arbitrary JSON.
serde_json = "1"
# The client uses a rustls-backed HTTP transport and no platform TLS library.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Bounded retry delays are asynchronous and inherit the caller's Tokio runtime.
tokio = { version = "1", features = ["time"] }

# Lints apply to every member that opts in with `[lints] workspace = true`, and
# to every target of that member. CI runs clippy with `-D warnings`, so anything
# set to "warn" here fails the build in CI.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic on its own; tests and examples may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Public fallible/panicking APIs must document their failure modes.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Documentation hygiene.
doc_markdown = "warn"
# `#[must_use]` on pure public functions.
must_use_candidate = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"
